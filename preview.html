<title>SPOKIY</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">

<style>
/* ============================================================
   SPOKIY — прев'ю дизайну.
   Свідомо однотемна сторінка: біло-чорно-золота палітра — це і є
   айдентика бренду, тому кольори задані явно й не залежать від теми.
   ============================================================ */

:root{
  color-scheme: light;
  --paper:#fbfaf8;
  --paper-2:#f2f0ed;
  --ink:#0a0a0a;
  --ink-70:#4a4a4a;
  --grey:#8a8a8a;
  --line:#e3e1de;
  --gold:#b2954f;
  --gold-soft:#d8c48c;

  --ui:"Commissioner","Helvetica Neue",Helvetica,Arial,sans-serif;
  --display:"Cormorant Garamond","Times New Roman",Times,Georgia,serif;

  --pad:clamp(16px,4vw,56px);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--ui);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{max-width:100%;display:block}
::selection{background:var(--gold-soft);color:var(--ink)}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

.caps{text-transform:uppercase;letter-spacing:.22em;font-size:10px;line-height:1.4}
.caps-lg{text-transform:uppercase;letter-spacing:.3em;font-size:12px}
.display{font-family:var(--display);font-weight:400;line-height:1.05}
.muted{color:var(--grey)}
.gold{color:var(--gold)}

/* демо-смуга */
.demo-bar{
  background:var(--ink);color:var(--paper);
  padding:9px var(--pad);
  display:flex;gap:14px;align-items:center;justify-content:center;
  text-align:center;flex-wrap:wrap;
}
.demo-bar b{color:var(--gold-soft);font-weight:500}

/* кнопки */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:42px;padding:0 22px;border:1px solid var(--ink);background:transparent;
  text-transform:uppercase;letter-spacing:.18em;font-size:10px;white-space:nowrap;
  transition:background .22s ease,color .22s ease,border-color .22s ease;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn-solid{background:var(--ink);color:var(--paper)}
.btn-solid:hover{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn-sm{height:34px;padding:0 16px;font-size:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* шапка */
.header{position:sticky;top:0;z-index:60;background:rgba(251,250,248,.93);
  backdrop-filter:saturate(150%) blur(8px);border-bottom:1px solid var(--line)}
.header-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:16px;padding:0 var(--pad);height:clamp(74px,9vw,96px)}
.header-nav{display:flex;gap:26px;align-items:center}
.header-actions{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.brand{text-align:center;line-height:1}
.brand-word{font-family:var(--display);font-size:clamp(19px,2.6vw,28px);
  letter-spacing:.4em;text-indent:.4em;font-weight:500}
.brand-sub{margin-top:7px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey)}
.lang-toggle{border:1px solid var(--line);height:30px;min-width:46px;padding:0 10px;
  font-size:10px;letter-spacing:.16em;transition:border-color .2s,color .2s}
.lang-toggle:hover{border-color:var(--ink);color:var(--gold)}
.header-mobile-cta{display:none}

/* перший екран */
.hero{padding:clamp(64px,11vw,140px) var(--pad) clamp(48px,8vw,92px);
  display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(30px,6vw,90px);
  align-items:end;border-bottom:1px solid var(--line)}
.hero h1{margin:0;font-size:clamp(40px,7.2vw,96px);text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero-side{padding-bottom:10px}
.hero-rule{width:54px;height:1px;background:var(--gold);margin:0 0 22px}
.hero-text{font-size:14px;line-height:1.85;color:var(--ink-70);max-width:42ch}

/* блок підтримки */
.comfort{padding:clamp(52px,9vw,110px) var(--pad);display:grid;
  grid-template-columns:220px 1fr;gap:clamp(24px,5vw,64px);
  border-bottom:1px solid var(--line);background:var(--paper-2)}
.comfort-body{max-width:70ch}
.comfort-body p{margin:0;font-family:var(--display);
  font-size:clamp(20px,2.4vw,29px);line-height:1.6}
.comfort-sign{margin-top:26px;color:var(--grey)}

/* каталог */
.catalog{padding:clamp(52px,9vw,100px) 0 clamp(44px,8vw,88px);border-bottom:1px solid var(--line)}
.catalog-head{padding:0 var(--pad);display:flex;align-items:baseline;
  justify-content:space-between;gap:20px;flex-wrap:wrap}
.catalog-title{margin:0;font-size:clamp(28px,4.4vw,52px)}
.tabs{display:flex;gap:4px;padding:28px var(--pad) 0;flex-wrap:wrap}
.tab{padding:9px 18px;border:1px solid var(--line);text-transform:uppercase;
  letter-spacing:.18em;font-size:10px;color:var(--grey);transition:all .2s ease}
.tab:hover{color:var(--ink);border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(252px,25vw);gap:1px;
  overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:var(--pad);
  padding:0 var(--pad);margin-top:30px;scrollbar-width:none;background:var(--line);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rail::-webkit-scrollbar{display:none}
.card{scroll-snap-align:start;background:var(--paper);padding:22px 22px 26px;
  display:flex;flex-direction:column}
.card-media{position:relative;aspect-ratio:4/5;background:var(--paper-2);
  overflow:hidden;margin-bottom:18px}
.card-media svg{width:100%;height:100%;display:block}
.card-badge{position:absolute;top:12px;left:12px;background:var(--paper);
  padding:5px 9px;border:1px solid var(--line)}
.card-badge.out{color:var(--grey)}
.card-name{font-family:var(--display);font-size:21px;font-weight:400;margin:0 0 6px}
.card-material{color:var(--grey);font-size:12px;line-height:1.6;margin-bottom:12px}
.card-meta{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.card-price{font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.card-price small{color:var(--grey);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;margin-right:5px}
.card-cta{margin-top:16px}
.rail-nav{display:flex;gap:8px;padding:22px var(--pad) 0;justify-content:flex-end}
.rail-btn{width:40px;height:40px;border:1px solid var(--line);display:grid;
  place-items:center;transition:all .2s}
.rail-btn:hover{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* як ми працюємо */
.steps{padding:clamp(52px,9vw,100px) var(--pad);display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(26px,4vw,60px);
  border-bottom:1px solid var(--line)}
.step-num{color:var(--gold);margin-bottom:14px;font-variant-numeric:tabular-nums}
.step h3{font-family:var(--display);font-size:22px;font-weight:400;margin:0 0 10px}
.step p{margin:0;color:var(--ink-70);line-height:1.8;max-width:34ch}

.footer{padding:clamp(38px,6vw,70px) var(--pad) 44px;display:grid;
  grid-template-columns:1fr auto;gap:26px;align-items:end}
.footer-links{display:flex;gap:22px;flex-wrap:wrap;align-items:center}

/* модальні */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(10,10,10,.42);
  backdrop-filter:blur(3px);display:flex;justify-content:flex-end;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);width:min(560px,100%);height:100%;overflow-y:auto;
  animation:slide .32s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column}
@keyframes slide{from{transform:translateX(28px);opacity:.4}}
.modal-head{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);
  padding:22px clamp(20px,4vw,38px);display:flex;align-items:center;
  justify-content:space-between;gap:16px;z-index:2}
.modal-body{padding:clamp(24px,4vw,38px);flex:1}
.modal-close{width:34px;height:34px;border:1px solid var(--line);display:grid;
  place-items:center;transition:all .2s;flex:none}
.modal-close:hover{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.steps-bar{display:flex;gap:6px;margin-bottom:30px}
.steps-bar span{flex:1;height:2px;background:var(--line)}
.steps-bar span.on{background:var(--gold)}

/* форми */
.field{margin-bottom:20px}
.field label{display:block;text-transform:uppercase;letter-spacing:.18em;
  font-size:9px;color:var(--grey);margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;border:none;
  border-bottom:1px solid var(--ink);background:transparent;padding:9px 0;
  font-family:var(--ui);font-size:14px;color:var(--ink);border-radius:0;appearance:none}
.field textarea{border:1px solid var(--line);padding:12px;min-height:88px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pet-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pet-option{border:1px solid var(--line);padding:16px 14px;text-align:left;
  transition:all .2s;display:flex;align-items:center;gap:12px}
.pet-option:hover{border-color:var(--ink)}
.pet-option[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.pet-glyph{font-size:20px;line-height:1}

.result-box{border:1px solid var(--ink);padding:22px;margin-bottom:28px}
.result-dims{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.result-dims div{border-left:1px solid var(--line);padding-left:12px}
.result-dims strong{display:block;font-family:var(--display);font-size:28px;
  font-weight:400;margin-top:4px;font-variant-numeric:tabular-nums}

.offer{display:grid;grid-template-columns:92px 1fr;gap:16px;border:1px solid var(--line);
  padding:14px;margin-bottom:10px;text-align:left;width:100%;align-items:start;
  transition:border-color .2s}
.offer:hover{border-color:var(--ink)}
.offer[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.offer-media{aspect-ratio:4/5;background:var(--paper-2);overflow:hidden}
.offer-media svg{width:100%;height:100%}
.offer h4{margin:0 0 4px;font-family:var(--display);font-size:18px;font-weight:400}
.offer-price{margin-top:10px;display:flex;align-items:baseline;
  justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}

.notice{border-left:2px solid var(--gold);background:var(--paper-2);padding:14px 16px;
  font-size:13px;line-height:1.7;margin:18px 0}
.error{color:#9c2b2b;font-size:12px;margin-top:12px}
.done-check{width:46px;height:46px;border:1px solid var(--gold);color:var(--gold);
  display:grid;place-items:center;margin-bottom:24px}

@media (max-width:900px){
  .header-nav{display:none}
  .hero,.comfort,.footer{grid-template-columns:1fr}
  .hero{align-items:start}
  .header-actions .btn-desktop{display:none}
  .header-mobile-cta{display:flex;gap:8px;padding:0 var(--pad) 14px}
  .header-mobile-cta .btn{flex:1}
  .rail{grid-auto-columns:minmax(230px,74vw)}
}
@media (max-width:560px){
  .field-row,.pet-picker{grid-template-columns:1fr}
  .offer{grid-template-columns:72px 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<style>
/* ── розмірні групи ── */
.sizebar{display:flex;align-items:flex-start;gap:16px;padding:22px var(--pad) 0;flex-wrap:wrap}
.sizebar-label{padding-top:12px;flex:none}
.sizebar-chips{display:flex;gap:6px;flex-wrap:wrap}
.size-chip{display:flex;flex-direction:column;gap:3px;text-align:left;
  border:1px solid var(--line);padding:9px 14px;transition:all .2s}
.size-chip:hover{border-color:var(--ink)}
.size-chip[aria-pressed="true"]{border-color:var(--gold);background:var(--paper-2)}
.size-chip-name{font-size:13px}
.size-chip-ex{font-size:11px;color:var(--grey)}
.size-chip[aria-pressed="true"] .size-chip-name{color:var(--gold)}

/* ── вибір групи в калькуляторі ── */
.cat-picker{display:grid;gap:8px}
.cat-option{display:flex;flex-direction:column;gap:3px;text-align:left;
  border:1px solid var(--line);padding:13px 16px;transition:all .2s}
.cat-option:hover{border-color:var(--ink)}
.cat-option[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cat-name{font-size:14px}
.cat-ex{font-size:12px;color:var(--grey)}
.cat-option[aria-pressed="true"] .cat-name{color:var(--gold)}

/* ── платне нанесення ── */
.addons{border:1px solid var(--line);padding:18px;margin-bottom:22px}
.addons-head{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.addon{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
  padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.addon input{appearance:none;width:18px;height:18px;border:1px solid var(--grey);
  margin:1px 0 0;position:relative;flex:none;cursor:pointer;background:transparent}
.addon input:checked{border-color:var(--gold);background:var(--gold)}
.addon input:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
.addon-body{display:flex;flex-direction:column;gap:2px}
.addon-name{font-size:14px}
.addon-hint{font-size:12px;color:var(--grey)}
.addon-price{font-size:13px;white-space:nowrap;color:var(--grey);font-variant-numeric:tabular-nums}
.addon[data-on] .addon-price{color:var(--gold)}

/* ── підсумок ── */
.totals{border:1px solid var(--ink);padding:16px 18px;margin-bottom:26px;
  display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.totals > div{display:flex;justify-content:space-between;gap:14px;font-size:13px}
.totals-sum{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;font-size:16px}
.totals-lead{display:block;color:var(--grey);letter-spacing:.14em}
</style>

<div class="demo-bar caps" id="demoBar">
  <span>Прев'ю дизайну · <b>каталог, калькулятор і нанесення працюють</b> · замовлення не надсилається</span>
</div>

<div id="app"></div>

<script>
/* ─────────────────────── моделі ─────────────────────── */

const MODELS = [
  {key:"classic",art:"classic",uk:"Класик",en:"Classic",
   muk:"Дуб, лак, фурнітура під золото",men:"Oak, lacquer, gold-finished hardware",
   duk:"Класична форма, тепле дерево, м'яка внутрішня оббивка кольору слонової кістки.",
   den:"A classic silhouette in warm wood, lined with soft ivory cloth."},
  {key:"minimal",art:"minimal",uk:"Мінімал",en:"Minimal",
   muk:"МДФ, матова біла емаль",men:"MDF, matte white enamel",
   duk:"Чисті лінії без декору. Біла матова поверхня, прихована фурнітура.",
   den:"Clean lines, no ornament. Matte white surface, concealed hardware."},
  {key:"noir",art:"noir",uk:"Ноар",en:"Noir",
   muk:"Ясен, чорна матова емаль",men:"Ash, matte black enamel",
   duk:"Глибокий чорний корпус і тонкий золотий кант по периметру кришки.",
   den:"A deep black body with a thin gold rule around the lid."},
  {key:"goldline",art:"goldline",uk:"Голд Лайн",en:"Gold Line",
   muk:"Біла емаль, золоте гравіювання",men:"White enamel, gold engraving",
   duk:"Біла емаль із гравіюванням імені та дат сусальним золотом.",
   den:"White enamel with the name and dates engraved in gold leaf."},
  {key:"eco",art:"eco",uk:"Еко",en:"Eco",
   muk:"Березова фанера, льон, без лаку",men:"Birch plywood, linen, unlacquered",
   duk:"Біорозкладна модель для поховання в землю. Натуральні матеріали.",
   den:"A biodegradable model for burial. Natural materials only."}
];

const PETS = {
  cat:{base:48,v:{classic:[34,70,3200,55],minimal:[34,70,2400,42],noir:[38,70,3600,60],goldline:[34,66,4200,70],eco:[34,70,1800,32]}},
  dog:{base:70,v:{classic:[32,120,5200,60],minimal:[32,120,4100,48],noir:[40,130,5900,66],goldline:[32,110,6800,78],eco:[32,120,3200,36]}},
  reptile:{base:45,v:{classic:[24,100,2600,48],minimal:[24,100,2000,38],noir:[24,110,2900,52],goldline:[24,90,3400,62],eco:[24,100,1500,28]}},
  rodent:{base:24,v:{classic:[18,40,1600,40],minimal:[18,40,1200,32],noir:[18,40,1800,45],goldline:[18,36,2200,55],eco:[18,40,900,22]}}
};

const PRODUCTS = [];
for (const pet of Object.keys(PETS)) {
  MODELS.forEach((m, i) => {
    const [min, max, base, perCm] = PETS[pet].v[m.key];
    PRODUCTS.push({
      id: pet + "-" + m.key, pet, sort: i + 1, art: m.art,
      name_uk: m.uk, name_en: m.en, material_uk: m.muk, material_en: m.men,
      desc_uk: m.duk, desc_en: m.den,
      min_length_cm: min, max_length_cm: max,
      base_price_uah: base, base_length_cm: PETS[pet].base, price_per_cm_uah: perCm,
      in_stock: true
    });
  });
}

/* ─────────────────────── розмірні групи ─────────────────────── */

const CATEGORIES = [
  {id:"cat-standard",pet:"cat",uk:"Кіт",en:"Cat",
   exuk:"до 5 кг · більшість порід",exen:"up to 5 kg · most breeds",ref:4.5},
  {id:"cat-large",pet:"cat",uk:"Великий кіт",en:"Large cat",
   exuk:"5–10 кг · мейн-кун, рагдол",exen:"5–10 kg · maine coon, ragdoll",ref:7},

  {id:"dog-small",pet:"dog",uk:"Мала порода",en:"Small breed",
   exuk:"до 10 кг · чихуахуа, той, йорк, шпіц",exen:"up to 10 kg · chihuahua, toy, yorkie",ref:5},
  {id:"dog-medium",pet:"dog",uk:"Середня порода",en:"Medium breed",
   exuk:"10–25 кг · бігль, кокер, шнауцер",exen:"10–25 kg · beagle, cocker, schnauzer",ref:17},
  {id:"dog-large",pet:"dog",uk:"Велика порода",en:"Large breed",
   exuk:"25–60 кг · лабрадор, вівчарка, ротвейлер",exen:"25–60 kg · labrador, shepherd, rottweiler",ref:38},

  {id:"reptile-small",pet:"reptile",uk:"Дрібні",en:"Small",
   exuk:"до 300 г · гекон, ящірка, дрібна змія",exen:"up to 300 g · gecko, lizard, small snake",ref:0.15},
  {id:"reptile-medium",pet:"reptile",uk:"Середні",en:"Medium",
   exuk:"0,3–3 кг · агама, черепаха, полоз",exen:"0.3–3 kg · bearded dragon, tortoise",ref:1.2},
  {id:"reptile-large",pet:"reptile",uk:"Великі",en:"Large",
   exuk:"3–20 кг · ігуана, пітон, велика черепаха",exen:"3–20 kg · iguana, python, large tortoise",ref:8},

  {id:"rodent-small",pet:"rodent",uk:"Дрібні",en:"Small",
   exuk:"до 500 г · хом'як, миша, щур, піщанка",exen:"up to 500 g · hamster, mouse, rat, gerbil",ref:0.25},
  {id:"rodent-medium",pet:"rodent",uk:"Середні",en:"Medium",
   exuk:"0,5–1,5 кг · морська свинка, шиншила, дегу",exen:"0.5–1.5 kg · guinea pig, chinchilla, degu",ref:0.8},
  {id:"rodent-large",pet:"rodent",uk:"Великі",en:"Large",
   exuk:"1,5–5 кг · кролик, тхір",exen:"1.5–5 kg · rabbit, ferret",ref:2.5}
];

const catsFor = pet => CATEGORIES.filter(c => c.pet === pet);

/* ─────────────────────── нанесення ─────────────────────── */

const ENGRAVING = [
  {id:"name",uk:"Ім'я улюбленця",en:"Pet's name",

const SHAPES = {
  cat:{k:28.5,w:.42,h:.34,margin:.14,min:[34,18,15],weight:[.3,15]},
  dog:{k:26,w:.44,h:.38,margin:.14,min:[32,18,15],weight:[.5,90]},
  reptile:{k:41,w:.26,h:.2,margin:.12,min:[24,12,9],weight:[.05,40]},
  rodent:{k:23,w:.46,h:.38,margin:.16,min:[18,11,9],weight:[.02,12]}
};

const up5 = n => Math.ceil(n / 5) * 5;

function calcDimensions(pet, kg) {
  const s = SHAPES[pet];
  const w = Math.min(Math.max(kg, s.weight[0]), s.weight[1]);
  const raw = Math.max(s.k * Math.cbrt(w) * (1 + s.margin), s.min[0]);
  return {
    length: up5(raw),
    width:  up5(Math.max(raw * s.w, s.min[1])),
    height: up5(Math.max(raw * s.h, s.min[2]))
  };
}

const dimsForCategory = c => calcDimensions(c.pet, c.ref);

function priceFor(p, length) {
  const raw = p.base_price_uah + (length - p.base_length_cm) * p.price_per_cm_uah;
  return Math.max(Math.round(raw / 50) * 50, Math.round(p.base_price_uah * .6));
}

function pickOffers(pet, dims, limit) {
  const pool = PRODUCTS.filter(p => p.pet === pet && p.in_stock).sort((a,b) => a.sort - b.sort);
  const fits = pool.filter(p => dims.length >= p.min_length_cm && dims.length <= p.max_length_cm);
  const dist = p => dims.length < p.min_length_cm ? p.min_length_cm - dims.length
                  : dims.length > p.max_length_cm ? dims.length - p.max_length_cm : 0;
  const rest = pool.filter(p => !fits.includes(p)).sort((a,b) => dist(a) - dist(b));
  return [...fits, ...rest].slice(0, Math.max(limit, 2))
    .map(p => ({ product: p, price: priceFor(p, dims.length), exactFit: fits.includes(p) }));
}

const THEME = {
  classic:{bg:"#f2f0ed",body:"#c9b18b",stroke:"#8d7550",detail:"#a98f66",hw:"#b2954f"},
  minimal:{bg:"#f2f0ed",body:"#fdfdfc",stroke:"#c9c6c1",detail:"#e3e1de",hw:"#b9b6b1"},
  noir:{bg:"#e8e6e3",body:"#151514",stroke:"#000000",detail:"#2c2c2a",hw:"#b2954f"},
  goldline:{bg:"#f2f0ed",body:"#fbfaf8",stroke:"#d8d4ce",detail:"#b2954f",hw:"#b2954f"},
  eco:{bg:"#efece6",body:"#e0cfae",stroke:"#b39c74",detail:"#c9b48c",hw:"#9c8560"}
};

const GEO = {
  coffin:{field:{x:136,y:62,w:128,h:380}},
  case:{field:{x:163,y:50,w:74,h:400}},
  box:{field:{x:118,y:205,w:164,h:128}}
};

const shapeFor = pet => pet === "reptile" ? "case" : pet === "rodent" ? "box" : "coffin";

function pattern(art, c, f) {
  const {x,y,w,h} = f;
  if (art === "classic" || art === "eco") {
    const rows = art === "eco" ? Math.max(6, Math.round(h / 20)) : 6;
    const col = art === "eco" ? c.stroke : c.detail;
    const sw = art === "eco" ? 0.6 : 0.9;
    const op = art === "eco" ? 0.45 : 0.6;
    return Array.from({length:rows}, (_, i) => {
      const ly = y + ((i + .5) * h) / rows;
      return `<line x1="${x+5}" y1="${ly}" x2="${x+w-5}" y2="${ly}" stroke="${col}" stroke-width="${sw}" opacity="${op}"/>`;
    }).join("");
  }
  if (art === "goldline") {
    const cx = x + w/2, cy = y + h/2, r = Math.min(w,h) * .19;
    return `<g stroke="${c.hw}" fill="none">
      <circle cx="${cx}" cy="${cy}" r="${r}" stroke-width="0.8"/>
      <line x1="${cx-w*.22}" y1="${cy+h*.24}" x2="${cx+w*.22}" y2="${cy+h*.24}" stroke-width="0.7"/>
      <line x1="${cx-w*.16}" y1="${cy+h*.28}" x2="${cx+w*.16}" y2="${cy+h*.28}" stroke-width="0.7"/>
      </g>
      <path d="M${cx} ${cy-r*.55} l${r*.28} ${r*.55} -${r*.28} ${r*.55} -${r*.28} -${r*.55} z" fill="${c.hw}"/>`;
  }
  if (art === "minimal") {
    return `<line x1="${x+w*.18}" y1="${y+h/2}" x2="${x+w*.82}" y2="${y+h/2}" stroke="${c.detail}" stroke-width="1"/>`;
  }
  return `<rect x="${x+4}" y="${y+4}" width="${w-8}" height="${h-8}" rx="3" fill="none" stroke="${c.hw}" stroke-width="1" opacity="0.85"/>`;
}

function handles(c, paths) {
  return `<g fill="none" stroke="${c.hw}" stroke-width="2.2" stroke-linecap="round">`
    + paths.map(d => `<path d="${d}"/>`).join("") + `</g>`;
}

function coffinSvg(art, pet) {
  const c = THEME[art] || THEME.minimal;
  const shape = shapeFor(pet);
  const withHardware = art !== "minimal" && art !== "eco";
  let inner = "";

  if (shape === "coffin") {
    const OUTER = "170,44 230,44 276,150 252,458 148,458 124,150";
    const INNER = "174,54 226,54 267,152 244,448 156,448 133,152";
    inner = `
      <polygon points="${OUTER}" fill="#000" opacity="0.05" transform="translate(6 8)"/>
      <polygon points="${OUTER}" fill="${c.body}" stroke="${c.stroke}" stroke-width="1.5"/>
      <polygon points="${INNER}" fill="none" stroke="${c.stroke}" stroke-width="0.8" opacity="0.55"/>
      <line x1="200" y1="54" x2="200" y2="448" stroke="${c.stroke}" stroke-width="0.7" opacity="0.4"/>
      ${pattern(art, c, GEO.coffin.field)}
      ${withHardware ? handles(c, ["M132 210 q-12 12 0 24","M268 210 q12 12 0 24","M138 350 q-12 12 0 24","M262 350 q12 12 0 24"]) : ""}`;
  } else if (shape === "case") {
    inner = `
      <rect x="150" y="34" width="100" height="432" rx="7" fill="#000" opacity="0.05" transform="translate(6 8)"/>
      <rect x="150" y="34" width="100" height="432" rx="7" fill="${c.body}" stroke="${c.stroke}" stroke-width="1.5"/>
      <rect x="159" y="43" width="82" height="414" rx="5" fill="none" stroke="${c.stroke}" stroke-width="0.8" opacity="0.55"/>
      <line x1="200" y1="43" x2="200" y2="457" stroke="${c.stroke}" stroke-width="0.7" opacity="0.4"/>
      ${pattern(art, c, GEO.case.field)}
      <g stroke="${c.hw}" stroke-width="2.4">
        <line x1="144" y1="156" x2="256" y2="156"/>
        <line x1="144" y1="330" x2="256" y2="330"/>
      </g>`;
  } else {
    inner = `
      <rect x="104" y="152" width="192" height="196" rx="6" fill="#000" opacity="0.05" transform="translate(5 7)"/>
      <rect x="104" y="152" width="192" height="196" rx="6" fill="${c.body}" stroke="${c.stroke}" stroke-width="1.5"/>
      <rect x="113" y="161" width="174" height="178" rx="4" fill="none" stroke="${c.stroke}" stroke-width="0.8" opacity="0.55"/>
      <line x1="104" y1="200" x2="296" y2="200" stroke="${c.stroke}" stroke-width="1" opacity="0.55"/>
      ${pattern(art, c, GEO.box.field)}
      <rect x="192" y="193" width="16" height="14" rx="2" fill="none" stroke="${c.hw}" stroke-width="1.6"/>
      ${withHardware ? handles(c, ["M100 238 q-11 12 0 24","M300 238 q11 12 0 24"]) : ""}`;
  }

  return `<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="400" height="500" fill="${c.bg}"/>${inner}</svg>`;
}

            </article>`).join("")}
        </div>

        <div class="rail-nav">
          <button class="rail-btn" data-scroll="-1" aria-label="←">${arrow("left")}</button>
          <button class="rail-btn" data-scroll="1" aria-label="→">${arrow("right")}</button>
        </div>
      </section>

      <section class="steps" id="care">
        ${[[d.care1,d.care1t],[d.care2,d.care2t],[d.care3,d.care3t]].map(([t,x],i) => `
          <div class="step">
            <div class="step-num caps">0${i+1}</div>
            <h3>${t}</h3>
            <p>${x}</p>
          </div>`).join("")}
      </section>
    </main>

    <footer class="footer">
      <div>
        <div class="brand-word" style="text-align:left">SPOKIY</div>
        <div class="brand-sub" style="letter-spacing:.18em">${d.brandSub}</div>
      </div>
      <div class="footer-links caps">
        <button data-act="contact">${d.ctaWrite}</button>
        <button data-act="calc">${d.ctaCalc}</button>
        <span class="muted">© 2026 SPOKIY. ${d.rights}</span>
      </div>
    </footer>

    ${state.modal === "calc" ? calcModal() : ""}
    ${state.modal === "contact" ? contactModal() : ""}
  `;

  document.documentElement.lang = state.lang;
  document.body.style.overflow = state.modal ? "hidden" : "";
}

function arrow(dir) {
  const d = dir === "right" ? "M0 5h13M9 1l4 4-4 4" : "M15 5H2M6 1L2 5l4 4";
  return `<svg width="15" height="10" viewBox="0 0 15 10" fill="none" aria-hidden="true"><path d="${d}" stroke="currentColor" stroke-width="1"/></svg>`;
}

const cross = `<svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><path d="M1 1l9 9M10 1l-9 9" stroke="currentColor" stroke-width="1.1"/></svg>`;

function contactModal() {
  const d = L();
  return `<div class="overlay" data-close="1">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${d.contactTitle}">
      <div class="modal-head">
        <div class="caps-lg">${d.contactTitle}</div>
        <button class="modal-close" data-act="close" aria-label="Close">${cross}</button>
      </div>
      <div class="modal-body">
        <p style="line-height:1.85;color:var(--ink-70);margin-top:0">${d.contactText}</p>
        <div class="result-box" style="margin-bottom:12px">
          <div class="caps muted">${d.contactPhone}</div>
          <div class="display" style="font-size:28px;margin-top:6px">${PHONE}</div>
        </div>
        <div class="result-box">
          <div class="caps muted">${d.contactEmail}</div>
          <div class="display" style="font-size:24px;margin-top:6px">${EMAIL}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function calcModal() {
  const d = L();
  const titles = [d.step1, d.step2, d.step3, d.step4];
  let body = "";

  if (state.step === 1) {
    const cats = catsFor(state.calcPet);
    const r = SHAPES[state.calcPet].weight;
    body = `
      <div class="field">
        <label>${d.calcPetLabel}</label>
        <div class="pet-picker">
          ${PET_KINDS.map(p => `
            <button class="pet-option" aria-pressed="${p === state.calcPet}" data-calcpet="${p}">
              <span class="pet-glyph">${GLYPH[p]}</span><span class="caps">${petLabel(p)}</span>
            </button>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>${d.calcCategoryLabel}</label>
        <div class="cat-picker">
          ${cats.map(c => `
            <button class="cat-option" aria-pressed="${c.id === state.calcCat}" data-calccat="${c.id}">
              <span class="cat-name">${esc(catName(c))}</span>
              <span class="cat-ex">${esc(catEx(c))}</span>
            </button>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>${d.calcWeightExact} · ${d.calcWeightLabel}</label>
        <input type="number" id="weight" min="${r[0]}" max="${r[1]}" step="0.1" value="${state.weight}">
        <div class="caps muted" style="margin-top:10px;letter-spacing:.08em">${d.calcWeightHint}</div>
      </div>
      ${state.error ? `<div class="error">${state.error}</div>` : ""}
      <button class="btn btn-solid" style="width:100%;margin-top:12px" data-act="calculate">${d.calcSubmit}</button>`;
  }

  if (state.step === 2 && state.dims) {
    const dim = state.dims;
    body = `
      <div class="result-box">
        <div class="caps muted">${d.calcResultTitle}</div>
        <div class="result-dims">
          <div><span class="caps muted">${d.calcLength}</span><strong>${dim.length}</strong><span class="caps muted">${d.cm}</span></div>
          <div><span class="caps muted">${d.calcWidth}</span><strong>${dim.width}</strong><span class="caps muted">${d.cm}</span></div>
          <div><span class="caps muted">${d.calcHeight}</span><strong>${dim.height}</strong><span class="caps muted">${d.cm}</span></div>
        </div>
      </div>
      <div class="caps muted" style="margin-bottom:14px">${d.calcOffersTitle}</div>
      ${state.offers.map(o => `
        <button class="offer" aria-pressed="${state.chosenId === o.product.id}" data-offer="${o.product.id}">
          <div class="offer-media">${coffinSvg(o.product.art, o.product.pet)}</div>
          <div>
            <h4>${esc(nameOf(o.product))}</h4>
            <div class="muted" style="font-size:12px;line-height:1.6">${esc(matOf(o.product))}</div>
            <div class="offer-price">
              <span class="caps" style="color:${o.exactFit ? "var(--gold)" : "var(--grey)"}">${o.exactFit ? d.calcExact : d.calcCustom}</span>
              <span style="font-size:14px">${money(o.price)} ${d.uah}</span>
            </div>
          </div>
        </button>`).join("")}
      <div style="display:flex;gap:10px;margin-top:22px">
        <button class="btn btn-sm" data-act="step" data-step="1">${d.back}</button>
        <button class="btn btn-sm btn-solid" style="flex:1" data-act="step" data-step="3" ${state.chosenId ? "" : "disabled"}>${d.choose}</button>
      </div>`;
  }

  if (state.step === 3 && state.chosenId) {
    const o = state.offers.find(x => x.product.id === state.chosenId);
    const dim = state.dims;
    const f = state.form;
    const ep = engPrice();
    const total = o.price + ep;
    body = `
      <div class="notice">
        <b>${esc(nameOf(o.product))}</b> · ${dim.length}×${dim.width}×${dim.height} ${d.cm} · ${money(o.price)} ${d.uah}
      </div>

      <div class="addons">
        <div class="addons-head">
          <span class="caps">${d.engravingTitle}</span>
          <span class="caps muted">${d.engravingSub}</span>
        </div>
        ${ENGRAVING.map(op => `
          <label class="addon" ${state.engIds.includes(op.id) ? 'data-on="1"' : ""}>
            <input type="checkbox" data-eng="${op.id}" ${state.engIds.includes(op.id) ? "checked" : ""}>
            <span class="addon-body">
              <span class="addon-name">${esc(engName(op))}</span>
              <span class="addon-hint">${esc(engHint(op))}</span>
            </span>
            <span class="addon-price">+${money(op.price)} ${d.uah}</span>
          </label>`).join("")}
        ${engNeedsText() ? `
          <div class="field" style="margin-top:16px;margin-bottom:4px">
            <label>${d.engravingTextLabel}</label>
            <textarea data-field="engText" placeholder="${esc(d.engravingTextPlaceholder)}">${esc(state.engText)}</textarea>
          </div>` : ""}
      </div>

      <div class="totals">
        <div><span class="muted">${d.coffinLabel}</span><span>${money(o.price)} ${d.uah}</span></div>
        ${ep > 0 ? `<div><span class="muted">${d.engravingTitle}</span><span>${money(ep)} ${d.uah}</span></div>` : ""}
        <div class="totals-sum"><span>${d.totalLabel}</span><span>${money(total)} ${d.uah}</span></div>
        <div class="caps muted totals-lead">${d.leadTitle}: ${needsExtraDays(o) ? d.leadPlus : d.leadBase}</div>
      </div>

      <div class="field-row">
        ${input("first_name", d.formFirstName, f.first_name)}
        ${input("last_name", d.formLastName, f.last_name)}
      </div>
      ${input("phone", d.formPhone, f.phone, "tel", "+380")}
      ${input("email", d.formEmail, f.email, "email")}
      ${input("post_office", d.formPostOffice, f.post_office, "text", "Дніпро, №12")}
      <div class="field">
        <label>${d.formPayment}</label>
        <select><option>${d.formPaymentTransfer}</option></select>
      </div>
      <div class="field">
        <label>${d.formComment}</label>
        <textarea data-field="comment">${esc(f.comment)}</textarea>
      </div>
      ${state.error ? `<div class="error">${state.error}</div>` : ""}
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn btn-sm" data-act="step" data-step="2">${d.back}</button>
        <button class="btn btn-sm btn-solid" style="flex:1" data-act="submit">${d.formSubmit}</button>
      </div>`;
  }

  if (state.step === 4) {
    body = `
      <div class="done-check"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true"><path d="M1 7l5.5 5.5L17 1" stroke="currentColor" stroke-width="1.4"/></svg></div>
      <h3 class="display" style="font-size:30px;margin:0 0 14px">${d.doneTitle}</h3>
      <p style="line-height:1.85;color:var(--ink-70);margin:0">${d.doneText}</p>
      <div class="result-box" style="margin-top:26px">
        <div class="caps muted">${d.doneNumber}</div>
        <div class="display" style="font-size:30px;margin-top:6px">№${state.orderId}</div>
        <div class="caps muted" style="margin-top:16px">${d.totalLabel}</div>
        <div class="display" style="font-size:24px;margin-top:4px">${money(state.orderTotal)} ${d.uah}</div>
      </div>
      <div class="notice">
        <div class="caps muted" style="margin-bottom:8px">${d.donePayTitle}</div>
        ${PAY_DETAILS}
        <div class="muted" style="margin-top:10px;font-size:12px">${d.donePayHint}</div>
      </div>
      <div class="caps muted">${d.leadTitle}: ${needsExtraDays(o) ? d.leadPlus : d.leadBase}</div>
      <div class="notice" style="border-left-color:var(--ink)">
        <span class="caps muted">Demo</span><br>${d.demoNote}
      </div>
      <button class="btn btn-solid" style="width:100%;margin-top:12px" data-act="close">${d.doneClose}</button>`;
  }

  return `<div class="overlay" data-close="1">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${d.calcTitle}">
      <div class="modal-head">
        <div>
          <div class="caps-lg">${d.calcTitle}</div>
          <div class="caps muted" style="margin-top:6px">${titles[state.step - 1]}</div>
        </div>
        <button class="modal-close" data-act="close" aria-label="Close">${cross}</button>
      </div>
      <div class="modal-body">
        <div class="steps-bar">${[1,2,3,4].map(i => `<span class="${i <= state.step ? "on" : ""}"></span>`).join("")}</div>
        ${body}
      </div>
    </div>
  </div>`;
}

function input(name, label, value, type = "text", placeholder = "") {
  return `<div class="field">
    <label>${label}</label>
    <input type="${type}" data-field="${name}" value="${esc(value)}" placeholder="${esc(placeholder)}">
  </div>`;
}

/* ─────────────────────── події ─────────────────────── */

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-pet],[data-cat],[data-calcpet],[data-calccat],[data-offer],[data-scroll]");

  if (!el) {
    if (e.target.dataset && e.target.dataset.close) close();
    return;
  }

  if (el.dataset.scroll) {
    const rail = document.getElementById("rail");
    rail.scrollBy({ left: Number(el.dataset.scroll) * Math.max(rail.clientWidth * .7, 260), behavior: "smooth" });
    return;
  }
  if (el.dataset.pet) {
    state.pet = el.dataset.pet;
    state.categoryId = catsFor(state.pet)[0].id;
    render(); return;
  }
  if (el.dataset.cat) { state.categoryId = el.dataset.cat; render(); return; }
  if (el.dataset.calcpet) {
    state.calcPet = el.dataset.calcpet;
    const c = catsFor(state.calcPet)[0];
    state.calcCat = c.id;
    state.weight = c.ref;
    render(); return;
  }
  if (el.dataset.calccat) {
    const c = CATEGORIES.find(x => x.id === el.dataset.calccat);
    state.calcCat = c.id;
    state.weight = c.ref;
    render(); return;
  }
  if (el.dataset.offer) { state.chosenId = el.dataset.offer; render(); return; }

  const act = el.dataset.act;

  if (act === "lang") { state.lang = state.lang === "uk" ? "en" : "uk"; render(); return; }
  if (act === "contact") { state.modal = "contact"; render(); return; }

  if (act === "calc") {
    state.modal = "calc";
    state.step = 1;
    state.error = "";
    state.chosenId = null;
    state.engIds = [];
    state.engText = "";
    state.presetId = el.dataset.product || null;
    if (el.dataset.petkind) state.calcPet = el.dataset.petkind;
    const c = CATEGORIES.find(x => x.id === el.dataset.catid) || catsFor(state.calcPet)[0];
    state.calcCat = c.id;
    state.weight = c.ref;
    render(); return;
  }

  if (act === "close") { close(); return; }

  if (act === "calculate") {
    const w = Number(document.getElementById("weight").value);
    if (!w || w <= 0) { state.error = L().formRequired; render(); return; }
    state.weight = w;
    state.error = "";
    state.dims = calcDimensions(state.calcPet, w);
    state.offers = pickOffers(state.calcPet, state.dims, 4);
    const pre = state.presetId && state.offers.find(o => o.product.id === state.presetId);
    state.chosenId = pre ? pre.product.id : null;
    state.step = 2;
    render(); return;
  }

  if (act === "step") { state.error = ""; state.step = Number(el.dataset.step); render(); return; }

  if (act === "submit") {
    const f = state.form;
    if (!f.first_name.trim() || !f.last_name.trim() || !f.post_office.trim()) {
      state.error = L().formRequired; render(); return;
    }
    if (!/^[\d+\s()-]{9,20}$/.test(f.phone.trim())) { state.error = L().formPhoneInvalid; render(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) { state.error = L().formEmailInvalid; render(); return; }
    if (engNeedsText() && !state.engText.trim()) { state.error = L().engravingTextRequired; render(); return; }

    const o = state.offers.find(x => x.product.id === state.chosenId);
    const now = new Date();
    state.orderId = String(now.getDate()).padStart(2,"0") + String(now.getMonth()+1).padStart(2,"0")
      + "-" + Math.floor(1000 + Math.random()*9000);
    state.orderTotal = o.price + engPrice();
    state.orderExtraDays = needsExtraDays(o);
    state.error = "";
    state.step = 4;
    render(); return;
  }
});

/* чекбокси нанесення */
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.eng;
  if (!id) return;
  state.engIds = e.target.checked
    ? [...state.engIds, id]
    : state.engIds.filter(x => x !== id);
  if (!engNeedsText()) state.engText = "";
  render();
});

/* поля форми — зберігаємо без перемальовування, щоб не втрачати фокус */
document.addEventListener("input", e => {
  const name = e.target.dataset && e.target.dataset.field;
  if (!name) return;
  if (name === "engText") state.engText = e.target.value;
  else state.form[name] = e.target.value;
});

document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

function close() {
  state.modal = null;
  state.step = 1;
  state.error = "";
  render();
}

render();
</script>
